services:
  floribot-localization:
    profiles: ["localization", "robot"]
    build:
      context: ..
      dockerfile: locali/Dockerfile
      args:
        ROBOT_LOCALIZATION_SHA: ${ROBOT_LOCALIZATION_SHA}
        FLORIBOT_BASE_REPO: ${FLORIBOT_BASE_REPO}
        FLORIBOT_BASE_REF: ${FLORIBOT_BASE_REF}

    image: floribot-localization:jazzy
    container_name: floribot-localization

    network_mode: host
    ipc: host
    pid: host
    privileged: true

    stdin_open: true
    tty: true
    working_dir: /ws

    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
      LOCALIZATION_CONFIG: ${LOCALIZATION_CONFIG}

    volumes:
      - ../bags:/ws/bags
      - /dev:/dev
      - /dev/bus/usb:/dev/bus/usb
      - /run/udev:/run/udev:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    command:
      - bash
      - -lc
      - |
          source /opt/ros/jazzy/setup.bash
          source /opt/robot_localization_ws/install/setup.bash

          echo "Using LOCALIZATION_CONFIG=${LOCALIZATION_CONFIG}"
          test -f "${LOCALIZATION_CONFIG}" || {
            echo "ERROR: params file not found: ${LOCALIZATION_CONFIG}"
            echo "Available files in /ws/config:"
            find /ws/config -maxdepth 4 -type f || true
            exit 1
          }

          exec ros2 run robot_localization ekf_node --ros-args --params-file ${LOCALIZATION_CONFIG}

    restart: unless-stopped
