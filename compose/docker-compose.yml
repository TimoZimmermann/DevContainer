services:
  floribot-localization:
    profiles: ["localization", "robot"]
    build:
      context: ..
      dockerfile: locali/Dockerfile
      args:
        ROBOT_LOCALIZATION_SHA: ${ROBOT_LOCALIZATION_SHA}

    image: floribot-localization:jazzy
    container_name: floribot-localization

    network_mode: host
    ipc: host
    pid: host
    privileged: true

    stdin_open: true
    tty: true
    working_dir: /ws

    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION}
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
      LOCALIZATION_CONFIG: ${LOCALIZATION_CONFIG}
      LOCALIZATION_COMMAND: ${LOCALIZATION_COMMAND:-bash}

    volumes:
      - ${FLORIBOT_BASE_REPO_PATH}/src:/ws/src/floribot_base:ro
      - ${FLORIBOT_BASE_REPO_PATH}/config:/ws/config:ro
      - ../bags:/ws/bags
      - /dev:/dev
      - /dev/bus/usb:/dev/bus/usb
      - /run/udev:/run/udev:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    command:
      - bash
      - -lc
      - |
          source /opt/ros/jazzy/setup.bash
          source /opt/robot_localization_ws/install/setup.bash

          if [ -d /ws/src ] && find /ws/src -mindepth 1 -maxdepth 3 -name package.xml | grep -q .; then
            rosdep install --from-paths /ws/src --ignore-src -r -y || true
            colcon build --symlink-install
            source /ws/install/setup.bash
          fi

          exec ${LOCALIZATION_COMMAND}

    restart: unless-stopped
